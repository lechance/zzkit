<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; margin: 0; padding: 12px; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; background: #1a1a2e; color: #e0e0e0; }
    h2 { margin: 0 0 12px; font-size: 16px; color: #fff; display: flex; align-items: center; gap: 8px; }
    h2 span { font-size: 18px; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #2a2a4a; }
    .row:last-child { border-bottom: none; }
    label { display: flex; align-items: center; gap: 8px; cursor: pointer; flex: 1; }
    input[type="checkbox"] { accent-color: #4fc3f7; width: 16px; height: 16px; cursor: pointer; }
    input[type="number"] { width: 52px; padding: 3px 5px; border: 1px solid #3a3a5a; border-radius: 4px; background: #16213e; color: #e0e0e0; font-size: 12px; }
    .btn { padding: 6px 14px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; transition: opacity .15s; }
    .btn:active { opacity: .7; }
    .btn-primary { background: #4fc3f7; color: #000; font-weight: 600; }
    .btn-danger { background: #e57373; color: #000; font-weight: 600; }
    .btn-sm { padding: 4px 10px; font-size: 11px; }
    .section { margin-top: 10px; }
    .section-title { font-size: 11px; text-transform: uppercase; color: #888; margin-bottom: 4px; letter-spacing: 0.5px; }
    .flex { display: flex; align-items: center; gap: 8px; }
    .mt8 { margin-top: 8px; }
    .badge { background: #2a2a4a; padding: 2px 8px; border-radius: 10px; font-size: 11px; color: #aaa; }
    .slash { color: #555; }
    hr { border: none; border-top: 1px solid #2a2a4a; margin: 10px 0; }
  </style>
</head>
<body>
  <h2><span>🧹</span> Site Cleaner</h2>

  <div class="row">
    <label><input type="checkbox" id="enabled"> <strong>Enabled</strong></label>
    <span class="badge" id="statusBadge">Off</span>
  </div>

  <div class="row">
    <label>Interval (minutes)</label>
    <input type="number" id="intervalMinutes" min="1" max="1440" value="60">
  </div>

  <hr>

  <div class="section-title">Data Types</div>
  <div class="row"><label><input type="checkbox" id="clearLocalStorage" checked> Local Storage</label></div>
  <div class="row"><label><input type="checkbox" id="clearSessionStorage" checked> Session Storage</label></div>
  <div class="row"><label><input type="checkbox" id="clearIndexedDB" checked> IndexedDB</label></div>
  <div class="row"><label><input type="checkbox" id="clearCookies" checked> Cookies</label></div>
  <div class="row"><label><input type="checkbox" id="clearCache" checked> Cache Storage</label></div>

  <hr>

  <div class="section-title">Scope</div>
  <div class="row"><label><input type="checkbox" id="matchAllUrls" checked> All URLs</label></div>
  <div class="row" id="customOriginsRow" style="display:none; flex-direction:column; align-items:stretch; gap:4px; padding:4px 0;">
    <label style="font-size:11px; color:#888;">Custom origins (one per line):</label>
    <textarea id="origins" rows="3" style="width:100%; background:#16213e; color:#e0e0e0; border:1px solid #3a3a5a; border-radius:4px; padding:4px; font-size:11px; resize:vertical;" placeholder="https://example.com&#10;https://another.com"></textarea>
  </div>

  <div class="flex mt8" style="justify-content:space-between;">
    <button class="btn btn-primary" id="saveBtn">Save</button>
    <button class="btn btn-danger btn-sm" id="cleanNowBtn">Clean Now</button>
  </div>

  <div id="status" style="margin-top:8px; font-size:11px; color:#888; text-align:center;"></div>

  <script src="popup.js"></script>
</body>
</html>
