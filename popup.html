<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #292a2d;
      --text: #d4d4d4;
      --heading: #e8e8e8;
      --muted: #8e8e8e;
      --border: #3d3e42;
      --input-bg: #333438;
      --accent: #e96c4c;
      --badge-bg: #333438;
      --danger: #db4245;
    }
    :root.force-light {
      --bg: #ffffff;
      --text: #1f2328;
      --heading: #0d1117;
      --muted: #656d76;
      --border: #d0d7de;
      --input-bg: #f6f8fa;
      --accent: #0d5c4e;
      --badge-bg: #eaeef2;
      --danger: #e57373;
    }
    @media (prefers-color-scheme: light) {
      :root:not(.force-dark):not(.force-light) {
        --bg: #ffffff;
        --text: #1f2328;
        --heading: #0d1117;
        --muted: #656d76;
        --border: #d0d7de;
        --input-bg: #f6f8fa;
        --accent: #0d5c4e;
        --badge-bg: #eaeef2;
        --danger: #e57373;
      }
    }
    body { width: 320px; margin: 0; padding: 12px; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; background: var(--bg); color: var(--text); }
    h2 { margin: 0 0 12px; font-size: 16px; color: var(--heading); display: flex; align-items: center; gap: 8px; }
    h2 span { font-size: 18px; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
    .row:last-child { border-bottom: none; }
    label { display: flex; align-items: center; gap: 8px; cursor: pointer; flex: 1; }
    input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
    input[type="number"] { width: 52px; padding: 3px 5px; border: 1px solid var(--border); border-radius: 4px; background: var(--input-bg); color: var(--text); font-size: 12px; }
    select { padding: 3px 5px; border: 1px solid var(--border); border-radius: 4px; background: var(--input-bg); color: var(--text); font-size: 12px; cursor: pointer; max-width: 190px; }
    .btn { padding: 6px 14px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; transition: opacity .15s; }
    .btn:active { opacity: .7; }
    .btn-primary { background: var(--accent); color: #fff; font-weight: 600; }
    .btn-danger { background: var(--danger); color: #fff; font-weight: 600; }
    .btn-sm { padding: 4px 10px; font-size: 11px; }
    .section { margin-top: 10px; }
    .section-title { font-size: 11px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; letter-spacing: 0.5px; }
    .flex { display: flex; align-items: center; gap: 8px; }
    .mt8 { margin-top: 8px; }
    .badge { background: var(--badge-bg); padding: 2px 8px; border-radius: 10px; font-size: 11px; color: var(--muted); }
    .badge-on { color: var(--accent); }
    .slash { color: var(--muted); }
    hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
    .theme-btn { background: none; border: 1px solid var(--border); border-radius: 5px; color: var(--text); cursor: pointer; font-size: 11px; padding: 3px 8px; }
  </style>
</head>
<body>
  <h2><span>🧹</span> zzkit</h2>

  <div class="row" style="justify-content:flex-end; border:none; padding:0 0 6px;">
    <button class="theme-btn" id="themeToggle">Auto</button>
  </div>

  <div class="row">
    <label><input type="checkbox" id="enabled"> <strong>Enabled</strong></label>
    <span class="badge" id="statusBadge">Off</span>
  </div>

  <div class="row">
    <label>Interval (minutes)</label>
    <input type="number" id="intervalMinutes" min="1" max="1440" value="60">
  </div>

  <hr>

  <div class="section-title">Data Types</div>
  <div class="row"><label><input type="checkbox" id="clearLocalStorage" checked> Local Storage</label></div>
  <div class="row"><label><input type="checkbox" id="clearSessionStorage" checked> Session Storage</label></div>
  <div class="row"><label><input type="checkbox" id="clearIndexedDB" checked> IndexedDB</label></div>
  <div class="row"><label><input type="checkbox" id="clearCookies" checked> Cookies</label></div>
  <div class="row"><label><input type="checkbox" id="clearCache" checked> Cache Storage</label></div>

  <hr>

  <div class="section-title">Scope</div>
  <div class="row"><label><input type="checkbox" id="matchAllUrls" checked> All URLs</label></div>
  <div class="row" id="customOriginsRow" style="display:none; flex-direction:column; align-items:stretch; gap:4px; padding:4px 0;">
    <label style="font-size:11px; color:var(--muted);">Custom origins (one per line):</label>
    <textarea id="origins" rows="3" style="width:100%; background:var(--input-bg); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:4px; font-size:11px; resize:vertical;" placeholder="https://example.com&#10;https://another.com"></textarea>
  </div>

  <hr>

  <div class="section-title">Privacy</div>
  <div class="row">
    <label for="webrtcPolicy" title="Controls which IP addresses WebRTC may expose (can prevent local/private IP leaks)">WebRTC IP handling</label>
    <select id="webrtcPolicy">
      <option value="default">Off (no restriction)</option>
      <option value="default_public_and_private_interfaces">Use public &amp; private interfaces</option>
      <option value="default_public_interface_only">Use public interface only</option>
      <option value="disable_non_proxied_udp">Disable non-proxied UDP</option>
    </select>
  </div>

  <div class="flex mt8" style="justify-content:space-between;">
    <button class="btn btn-primary" id="saveBtn">Save</button>
    <button class="btn btn-danger btn-sm" id="cleanNowBtn">Clean Now</button>
  </div>

  <div id="status" style="margin-top:8px; font-size:11px; color:var(--muted); text-align:center;"></div>

  <script src="popup.js"></script>
</body>
</html>
